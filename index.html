<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة أثر التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900;950&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --splash-bg: #050914;
            --tech-dark: #2563eb;
            --tech-mid: #1d4ed8;
            --tech-light: #60a5fa;
            --accent-lines: rgba(59, 130, 246, 0.05);
            --input-bg: #0d1527;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, sans-serif;
            background-color: var(--splash-bg);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ================= الخطوط الهندسية التجريدية الطرفية الثابتة ================= */
        .geo-decor {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid var(--accent-lines);
            border-radius: 40px;
            transform: rotate(45deg);
            pointer-events: none;
        }

        .top-decor-1 { top: -120px; right: -50px; }
        .top-decor-2 { top: -70px; right: -100px; border-radius: 60px; }
        .top-decor-3 { top: -20px; right: -40px; border-radius: 30px; }

        .bottom-decor-1 { bottom: -120px; left: -50px; }
        .bottom-decor-2 { bottom: -70px; left: -100px; border-radius: 60px; }
        .bottom-decor-3 { bottom: -20px; left: -40px; border-radius: 30px; }

        /* ================= واجهة التحميل ================= */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--splash-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-center-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -60px;
            animation: fadeInLogo 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .athar-prism-shield {
            width: 150px;
            height: 150px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.65));
        }

        .prism-shape {
            width: 110px;
            height: 120px;
            position: relative;
        }

        .prism-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 55px;
            height: 120px;
            background: var(--tech-dark);
            clip-path: polygon(100% 0%, 100% 100%, 0% 80%, 0% 25%);
            z-index: 1;
        }

.prism-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 55px;
            height: 120px;
            background: var(--tech-mid);
            clip-path: polygon(0% 0%, 100% 25%, 100% 80%, 0% 100%);
            z-index: 2;
            filter: drop-shadow(-4px 4px 6px rgba(0,0,0,0.3));
        }

        .prism-core-cut {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 70px;
            height: 85px;
            background-color: var(--splash-bg);
            clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
            z-index: 3;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.4);
        }

        .prism-alif-pillar {
            position: absolute;
            bottom: 0;
            left: 46px;
            width: 18px;
            height: 50px;
            background: var(--tech-light);
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            z-index: 4;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .prism-hamza {
            position: absolute;
            top: 12px;
            left: 48px;
            width: 14px;
            height: 14px;
            background-color: var(--tech-light);
            transform: rotate(45deg);
            border-radius: 2px;
            z-index: 5;
            filter: drop-shadow(1px 3px 3px rgba(0, 0, 0, 0.3));
        }

        .bottom-area {
            position: absolute;
            bottom: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 10;
            width: 100%;
        }

        .custom-tech-loader {
            width: 32px;
            height: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-cube {
            width: 100%;
            height: 100%;
            border: 3px solid var(--tech-mid);
            border-radius: 8px;
            position: absolute;
            animation: techRotate 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-core {
            width: 12px;
            height: 12px;
            background-color: var(--tech-light);
            border-radius: 3px;
            animation: corePulse 1.6s ease-in-out infinite;
        }

        @keyframes techRotate {
            0% { transform: rotate(0deg); border-color: var(--tech-mid); }
            50% { border-color: var(--tech-light); border-radius: 12px; }
            100% { transform: rotate(180deg); border-color: var(--tech-mid); }
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .footer-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .copyright-text {
            font-size: 13px;
            color: #475569;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .version-tag {
            font-size: 11px;
            color: #334155;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ================= واجهة تسجيل الدخول ================= */
        #login-screen {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login-screen.visible {
            opacity: 1;
            visibility: visible;
        }

.login-card {
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            animation: fadeInCard 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @media (min-width: 768px) {
            .login-card {
                max-width: 460px;
                background-color: rgba(13, 21, 39, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.02);
                border-radius: 32px;
                padding: 40px 45px;
            }
            .prism-core-cut {
                background-color: #070e1b !important;
            }
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .athar-prism-shield-login {
            width: 130px;
            height: 130px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.85);
            margin-bottom: -10px;
            will-change: transform;
        }

        .prism-shape-login {
            width: 100px;
            height: 110px;
            position: relative;
            margin: 10px auto;
        }

        .form-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            padding-right: 4px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            background-color: var(--input-bg);
            border: 2px solid rgba(59, 130, 246, 0.04);
            border-radius: 14px;
            padding: 13px 16px;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: border-color 0.2s ease;
            -webkit-user-select: text;
            user-select: text;
        }

        .input-field:focus {
            border-color: var(--tech-mid);
        }

        .input-field-pass {
            padding-left: 50px;
        }

        .pass-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .pass-toggle:hover .eye-svg {
            stroke: var(--tech-light);
        }

        .eye-line {
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-dasharray: 30;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.35s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.2s ease;
        }

        .eye-visible .eye-line {
            stroke-dashoffset: 30;
        }

        .action-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

.btn-primary {
            width: 100%;
            background: var(--tech-dark);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary:active {
            background: var(--tech-mid);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--tech-light);
            border: 2px solid rgba(96, 165, 250, 0.15);
            border-radius: 14px;
            padding: 11px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-secondary:active {
            background: rgba(96, 165, 250, 0.04);
        }

        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #232d3f;
            font-size: 12px;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: rgba(51, 65, 85, 0.2);
        }

        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: background 0.2s ease;
        }

        .btn-google:active {
            background-color: #f1f5f9;
        }

        .google-icon {
            width: 18px;
            height: 18px;
            display: block;
        }

        .footer-info-login {
            text-align: center;
            margin-top: 10px;
        }

        .copyright-text-login {
            font-size: 12px;
            color: #3b4758;
            font-weight: 700;
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 20, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- ================= واجهة التحميل ================= -->
    <div id="splash-screen">
        <div class="geo-decor top-decor-1"></div>
        <div class="geo-decor top-decor-2"></div>
        <div class="geo-decor top-decor-3"></div>
        <div class="geo-decor bottom-decor-1"></div>
        <div class="geo-decor bottom-decor-2"></div>
        <div class="geo-decor bottom-decor-3"></div>

        <div class="splash-center-content">
            <div class="athar-prism-shield">
                <div class="prism-hamza"></div>
                <div class="prism-shape">
                    <div class="prism-left"></div>
                    <div class="prism-right"></div>
                    <div class="prism-core-cut"></div>
                    <div class="prism-alif-pillar"></div>
                </div>
            </div>
        </div>

        <div class="bottom-area">
            <div class="custom-tech-loader">
                <div class="loader-cube"></div>

<div class="loader-core"></div>
            </div>
            
            <div class="footer-info">
                <div class="copyright-text">مطوّر بواسطة منصة أثر التعليمية © 2026</div>
                <div class="version-tag">version 1.0.0</div>
            </div>
        </div>
    </div>

    <!-- ================= واجهة تسجيل الدخول ================= -->
    <div id="login-screen">
        <div class="geo-decor top-decor-1"></div>
        <div class="geo-decor top-decor-2"></div>
        <div class="geo-decor top-decor-3"></div>
        <div class="geo-decor bottom-decor-1"></div>
        <div class="geo-decor bottom-decor-2"></div>
        <div class="geo-decor bottom-decor-3"></div>

        <div class="login-card">
            <div class="athar-prism-shield-login">
                <div class="prism-shape-login">
                    <div class="prism-left"></div>
                    <div class="prism-right"></div>
                    <div class="prism-core-cut"></div>
                    <div class="prism-alif-pillar"></div>
                </div>
            </div>

            <div class="form-container" id="dynamic-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="email-in" class="input-field" placeholder="example@domain.com" autocomplete="off">
                    </div>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="pass-input" class="input-field input-field-pass" placeholder="••••••••" autocomplete="off">
                        <div class="pass-toggle" onclick="togglePasswordVisibility('pass-input', 'eye-icon')">
                            <svg class="eye-svg" id="eye-icon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                                <line class="eye-line" x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" id="main-submit-btn" onclick="processSubmit()">تسجيل الدخول</button>
                <button class="btn-secondary" id="switch-mode-btn" onclick="switchToRegisterMode()">إنشاء حساب جديد</button>
                
                <div class="divider" id="google-divider">أو ميزة الدخول السريع</div>
                
                <button class="btn-google" id="google-btn" onclick="showLoader()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.61c-.29 1.53-1.14 2.82-2.4 3.68l3.72 2.88c2.18-2.01 3.42-4.97 3.42-8.41z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.72-2.88c-1.03.69-2.35 1.11-4.21 1.11-3.24 0-5.99-2.19-6.97-5.13l-3.86 3c1.96 3.9 5.97 6.81 10.83 6.81z"/>
                        <path fill="#FBBC05" d="M5.03 14.19c-.25-.76-.4-1.57-.4-2.41s.15-1.65.4-2.41l-3.86-3C.41 7.82 0 9.86 0 12s.41 4.18 1.17 5.62l3.86-3z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0 7.14 0 3.13 2.91 1.17 6.81l3.86 3c.98-2.94 3.73-5.13 6.97-5.13z"/>
                    </svg>
                    <span>متابعة باستخدام حساب Google</span>
                </button>
            </div>

            <div class="footer-info-login">
                <div class="copyright-text-login">مطوّر بواسطة منصة أثر التعليمية © 2026</div>
            </div>
        </div>
    </div>

<div id="loader-overlay">
        <div class="custom-tech-loader">
            <div class="loader-cube"></div>
            <div class="loader-core"></div>
        </div>
    </div>

    <script>
        // الانتقال من واجهة التحميل لواجهة تسجيل الدخول بعد 3 ثواني
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.add('visible');
            }, 3000);
        });

        // دالة التحميل
        function showLoader() { 
            document.getElementById('loader-overlay').style.display = 'flex'; 
        }

        // دالة تبديل رؤية كلمة المرور
        function togglePasswordVisibility(fieldId, iconId) {
            const passInput = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(iconId);
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.add('eye-visible');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('eye-visible');
            }
        }
        
        // دالة التحقق من البيانات
        function processSubmit() {
            const isRegisterMode = document.getElementById('main-submit-btn').innerText === 'تأكيد إنشاء الحساب';
            const email = document.getElementById('email-in').value;
            const pass = document.getElementById('pass-input').value;
            
            if(!email.includes('@')) { alert("يرجى إدخال بريد إلكتروني صحيح"); return; }
            if(pass.length < 8) { alert("كلمة المرور يجب أن تكون 8 رموز فأكثر"); return; }

            if (isRegisterMode) {
                const name = document.getElementById('name-in').value;
                const phone = document.getElementById('phone-in').value;
                const confirmPass = document.getElementById('pass-confirm').value;

                if(name.split(' ').length < 4) { alert("يرجى إدخال الاسم الرباعي"); return; }
                if(!phone.startsWith('07') || phone.length !== 11) { alert("يرجى إدخال رقم هاتف عراقي صحيح"); return; }
                if(pass !== confirmPass) { alert("كلمة المرور غير متطابقة"); return; }
            }
            showLoader();
        }

        // دالة الانتقال لوضع التسجيل
        function switchToRegisterMode() {
            showLoader();
            setTimeout(() => {
                document.getElementById('dynamic-form').innerHTML = `
                    <div class="input-group"><label>الاسم الرباعي</label><input type="text" id="name-in" class="input-field" placeholder="الاسم الرباعي"></div>
                    <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="phone-in" class="input-field" placeholder="07XXXXXXXXX"></div>
                    <div class="input-group"><label>البريد الإلكتروني</label><input type="email" id="email-in" class="input-field" placeholder="example@domain.com"></div>
                    <div class="input-group"><label>كلمة المرور</label>
                        <div class="input-wrapper">
                            <input type="password" id="pass-input" class="input-field input-field-pass" placeholder="••••••••">
                            <div class="pass-toggle" onclick="togglePasswordVisibility('pass-input', 'eye-1')">
                                <svg class="eye-svg" id="eye-1" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="eye-line" x1="1" y1="1" x2="23" y2="23"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="input-group"><label>تأكيد كلمة المرور</label>

<div class="input-wrapper">
                            <input type="password" id="pass-confirm" class="input-field input-field-pass" placeholder="••••••••">
                            <div class="pass-toggle" onclick="togglePasswordVisibility('pass-confirm', 'eye-2')">
                                <svg class="eye-svg" id="eye-2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="eye-line" x1="1" y1="1" x2="23" y2="23"/></svg>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('main-submit-btn').innerText = 'تأكيد إنشاء الحساب';
                document.getElementById('switch-mode-btn').innerText = 'لديك حساب؟ تسجيل الدخول';
                document.getElementById('switch-mode-btn').setAttribute('onclick', 'location.reload()');
                document.getElementById('google-divider').style.display = 'none';
                document.getElementById('google-btn').style.display = 'none';
                document.getElementById('loader-overlay').style.display = 'none';
            }, 800);
        }
    </script>

</body>
</html>
